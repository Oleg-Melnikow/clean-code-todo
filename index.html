<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link href="https://googleapis.com" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" />
  </head>

  <body>
    <header class="matrix-info">
      <img src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix" />
      <a href="https://goal-life.com">Want more details&quest;</a>
    </header>

    <main class="todo-app">
      <section class="todo-app__add-panel">
        <label for="new-task" class="todo-app__title">Add Item</label>
        <div class="form">
          <input id="new-task" class="form__input field" type="text" />
          <button class="btn btn--add">Add</button>
        </div>
      </section>

      <section class="todo-app__section">
        <h3 class="todo-app__title">Todo</h3>
        <ul id="incomplete-tasks" class="list">
          <li class="task">
            <input type="checkbox" class="task__checkbox" />
            <label class="task__label">Pay Bills</label>
            <input type="text" class="task__input field" />
            <button class="btn btn--edit">Edit</button>
            <button class="btn btn--del">
              <img src="./remove.svg" alt="Delete" />
            </button>
          </li>
          <li class="task task--edit-mode">
            <input type="checkbox" class="task__checkbox" />
            <label class="task__label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task__input field" />
            <button class="btn btn--edit">Save</button>
            <button class="btn btn--del">
              <img src="./remove.svg" alt="Delete" />
            </button>
          </li>
        </ul>
      </section>

      <section class="todo-app__section">
        <h3 class="todo-app__title">Completed</h3>
        <ul id="completed-tasks" class="list list--done">
          <li class="task">
            <input type="checkbox" class="task__checkbox" checked />
            <label class="task__label">See the Doctor</label>
            <input type="text" class="task__input field" />
            <button class="btn btn--edit">Edit</button>
            <button class="btn btn--del">
              <img src="./remove.svg" alt="Delete" />
            </button>
          </li>
        </ul>
      </section>
    </main>

    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
